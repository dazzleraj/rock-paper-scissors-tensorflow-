version = "0.1.0"
description = "Rock-Paper-Scissors Classifier with CNN, OpenCV Webcam, and Streamlit"
readme = "README.md"
authors = [
    { name = "Dazzle Raj", email = "dazzleraj@samcorporate.com" }
]
requires-python = ">=3.12"
dependencies = [
    "tensorflow>=2.16.0",
